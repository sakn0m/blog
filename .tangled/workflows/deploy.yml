when:
  - event: ["push"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nodejs
  github:NixOS/nixpkgs/nixpkgs-unstable:
    - bun

steps:
  - name: "Sync to ATProto"
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      bun install
      bun run scripts/sync-to-atproto.ts

  - name: "Build"
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      bun run build

  - name: "Deploy to Cloudflare"
    command: |
      export PATH="$HOME/.nix-profile/bin:$PATH"
      npx --yes wrangler@latest deploy
